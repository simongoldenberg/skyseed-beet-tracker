name: Deploy to GitHub Pages

# Keine Build-Pipeline — es wird nur der bestehende Ordner
# skyseed-beet-tracker/ unveraendert als Pages-Artefakt hochgeladen.
on:
  push:
    branches: [main]
    paths:
      - 'skyseed-beet-tracker/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skyseed-beet-tracker
      - id: deployment
        uses: actions/deploy-pages@v4
